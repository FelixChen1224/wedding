<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 1100" role="img" aria-labelledby="title desc">
  <title id="title">紅門婚紗風格喜宴封面</title>
  <desc id="desc">以紅色門牆、金色門釘、綠地與婚紗白色輪廓構成的喜宴邀請背景。</desc>
  <defs>
    <linearGradient id="redWall" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#cf1520"/>
      <stop offset="0.48" stop-color="#a70f1a"/>
      <stop offset="1" stop-color="#62121a"/>
    </linearGradient>
    <linearGradient id="deepRed" x1="0" x2="1">
      <stop offset="0" stop-color="#5a1018" stop-opacity="0.72"/>
      <stop offset="0.56" stop-color="#8e1420" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#1a1612" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="garden" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#cadfcf"/>
      <stop offset="0.48" stop-color="#6c956c"/>
      <stop offset="1" stop-color="#20483c"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="0.42" stop-color="#d6a641"/>
      <stop offset="0.76" stop-color="#fff2c4"/>
      <stop offset="1" stop-color="#9a661c"/>
    </linearGradient>
    <linearGradient id="gown" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.52" stop-color="#f4efe5"/>
      <stop offset="1" stop-color="#d8c9ad"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#2d1612" flood-opacity="0.28"/>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

